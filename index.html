<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Estoque de Veículos</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>🚗 Relatório de Estoque de Veículos</h1>
      <p>Cadastre os veículos abaixo e gere o relatório oficial em PDF.</p>
    </header>

    <section class="card form-section">
      <h2>Cadastrar Novo Veículo</h2>
      <form id="carForm">
        <div class="form-group">
          <label for="brand">Marca</label>
          <input type="text" id="brand" placeholder="Ex: Toyota" required>
        </div>
        <div class="form-group">
          <label for="model">Modelo</label>
          <input type="text" id="model" placeholder="Ex: Corolla" required>
        </div>
        <div class="form-group">
          <label for="year">Ano</label>
          <input type="number" id="year" placeholder="Ex: 2022" min="1900" max="2099" required>
        </div>
        <div class="form-group">
          <label for="color">Cor</label>
          <input type="text" id="color" placeholder="Ex: Prata" required>
        </div>
        <div class="form-group">
          <label for="price">Preço (R$)</label>
          <input type="number" id="price" step="0.01" placeholder="Ex: 85000" required>
        </div>
        <div class="form-group">
          <label for="status">Status</label>
          <select id="status">
            <option value="Disponível">Disponível</option>
            <option value="Vendido">Vendido</option>
            <option value="Reservado">Reservado</option>
          </select>
        </div>
        <button type="submit" class="btn btn-add">+ Adicionar Veículo</button>
      </form>
    </section>

    <div id="reportArea">
      <div class="report-header">
        <h2>RELATÓRIO DE ESTOQUE DE VEÍCULOS</h2>
        <p id="reportDate"></p>
      </div>

      <div class="summary-cards">
        <div class="summary-card">
          <span>Total de Veículos</span>
          <strong id="totalVehicles">0</strong>
        </div>
        <div class="summary-card">
          <span>Valor Total do Estoque</span>
          <strong id="totalValue">R$ 0,00</strong>
        </div>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Marca / Modelo</th>
            <th>Ano</th>
            <th>Cor</th>
            <th>Status</th>
            <th>Preço (R$)</th>
            <th class="no-pdf">Ações</th>
          </tr>
        </thead>
        <tbody id="carTableBody">
          </tbody>
      </table>
    </div>

    <div class="actions">
      <button id="btnExportPdf" class="btn btn-pdf">📄 Baixar Relatório em PDF</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
